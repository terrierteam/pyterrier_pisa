name: deploy

on:
  release:
    types: [created]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-wheels:
    name: build-${{ matrix.cibw_build }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cibw_build:
          - cp39-manylinux_x86_64
          - cp310-manylinux_x86_64
          - cp311-manylinux_x86_64
          - cp312-manylinux_x86_64
          - cp313-manylinux_x86_64
          - cp314-manylinux_x86_64
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    
    - name: install-deps
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Apply patches to rapidcheck to support cibuildwheel v3 base images
      run: |
        sed -i '/^#include <limits>$/a #include <cstdint>' pisa/external/rapidcheck/include/rapidcheck/detail/Utility.h 
        sed -i '1i#include <cstdint>' pisa/external/rapidcheck/src/detail/Base64.h pisa/external/rapidcheck/src/detail/Base64.cpp pisa/external/rapidcheck/include/rapidcheck/detail/Serialization.hpp
    
    - uses: pypa/cibuildwheel@v3.2.1
      with:
        output-dir: wheelhouse
      env:
        CIBW_BEFORE_BUILD: "python -m pip install scikit-build-core 'tbb<=2020.3.254' 'numpy<=2.5.0' cmake ninja -v"
        CIBW_BUILD_VERBOSITY: '1'
        CIBW_BEFORE_ALL_LINUX: "gcc --version"
        CIBW_ARCHS_LINUX: "x86_64"
        CIBW_BUILD: ${{ matrix.cibw_build }}
        # Avoid mixing externally-installed TBB binaries with TBB installed by pip
        # Check for AVX-512 instructions in the wheel, which are not supported by all CPUs and can cause illegal instruction errors at runtime. If found, fail the build.
        CIBW_REPAIR_WHEEL_COMMAND: >   
          auditwheel show {wheel} &&
          mkdir -p /tmp/wheelcheck &&
          python -m zipfile -e {wheel} /tmp/wheelcheck &&
          echo "Scanning for AVX-512 instructions..." &&
          if objdump -d /tmp/wheelcheck/**/*.so 2>/dev/null |  grep -qE "zmm|vmovdqu64|vmovdqa64"; then
              echo "ERROR: AVX-512 instructions found in wheel:" && 
              objdump -d /tmp/wheelcheck/**/*.so 2>/dev/null |  grep -E "zmm|vmovdqu64|vmovdqa64" &&
              exit 1
          fi &&
          PYTHON=`python -c "import sys; print(sys.executable)"` &&
          export LD_LIBRARY_PATH=`dirname $PYTHON`/../lib &&
          auditwheel repair --exclude libtbb.so.* -w {dest_dir} {wheel}
        # prevent over-optimisation of the build to the CI machine 
        CIBW_ENVIRONMENT: >
          CMAKE_POLICY_VERSION_MINIMUM=3.5
          CFLAGS="-O3 -march=x86-64 -mtune=generic -fno-tree-vectorize -mno-avx512f -mno-avx512dq -mno-avx512bw -mno-avx512vl"
          CXXFLAGS="-O3 -march=x86-64 -mtune=generic -fno-tree-vectorize -mno-avx512f -mno-avx512dq -mno-avx512bw -mno-avx512vl -Wno-error=changes-meaning"
    
    - uses: actions/upload-artifact@v7
      with:
        name: bdist-manylinux2010-${{ matrix.cibw_build }}
        path: wheelhouse/*

  pypi:
    if: ${{ github.event_name == 'release' }}
    needs: build-wheels
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: install-deps
      run: |
        python -m pip install --upgrade pip
        pip install twine

    - uses: actions/download-artifact@v8
      with:
        pattern: bdist-manylinux2010-*
        merge-multiple: true
        path: wheelhouse

    - name: upload Release
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        twine upload --verbose wheelhouse/*
