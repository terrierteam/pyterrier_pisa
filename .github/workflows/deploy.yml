name: deploy

on:
  release:
    types: [created]
  workflow_dispatch: {}

jobs:
  pypi:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive

    - uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    
    - name: install-deps
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - uses: pypa/cibuildwheel@v2.19.2
      with:
        output-dir: wheelhouse
      env:
        CIBW_BEFORE_BUILD: "python -m pip install scikit-build-core 'tbb<=2020.3.254' numpy cmake ninja -v"
        CIBW_BUILD_VERBOSITY: '1'
        CIBW_BEFORE_ALL_LINUX: "gcc --version"
        CIBW_ARCHS_LINUX: "x86_64"
        # Only supports cpython 3.9 - 3.13 on manylinux_x86_64
        CIBW_BUILD: 'cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64'
        # Avoid mixing externally-installed TBB binaries with TBB installed by pip
        # Check for AVX-512 instructions in the wheel, which are not supported by all CPUs and can cause illegal instruction errors at runtime. If found, fail the build.
        CIBW_REPAIR_WHEEL_COMMAND: >   
          auditwheel show {wheel} &&
          mkdir -p /tmp/wheelcheck &&
          python -m zipfile -e {wheel} /tmp/wheelcheck &&
          echo "Scanning for AVX-512 instructions..." &&
          if objdump -d /tmp/wheelcheck/**/*.so 2>/dev/null |  grep -qE "zmm|vmovdqu64|vmovdqa64|vpbroadcast"; then
              echo "ERROR: AVX-512 instructions found in wheel" &&
              exit 1
          fi &&
          PYTHON=`python -c "import sys; print(sys.executable)"` &&
          export LD_LIBRARY_PATH=`dirname $PYTHON`/../lib &&
          auditwheel repair --exclude libtbb.so.* -w {dest_dir} {wheel}
        # prevent over-optimisation of the build to the CI machine 
        CIBW_ENVIRONMENT: >
          CMAKE_POLICY_VERSION_MINIMUM=3.5
          CFLAGS="-O3 -march=x86-64 -mtune=generic -fno-tree-vectorize -mno-avx512f -mno-avx512dq -mno-avx512bw -mno-avx512vl"
          CXXFLAGS="-O3 -march=x86-64 -mtune=generic -fno-tree-vectorize -mno-avx512f -mno-avx512dq -mno-avx512bw -mno-avx512vl"
    
    - name: upload Release
      if: ${{ github.event_name == 'release' }}
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        twine upload --verbose wheelhouse/*

    - uses: actions/upload-artifact@v4
      with:
        name: bdist-manylinux2010
        path: wheelhouse/*
