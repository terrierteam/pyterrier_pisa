name: deploy

on:
  release:
    types: [created]
  workflow_dispatch: {}

jobs:
  pypi:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: install-deps
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - uses: pypa/cibuildwheel@v2.19.2
      with:
        output-dir: wheelhouse
      env:
        # Avoid mixing externally-installed TBB binaries with TBB installed by pip
        CIBW_BEFORE_ALL: "yum clean all ; yum check ; yum erase apf ; yum update ca-certificates ; yum upgrade ; pip install scikit-build-core numpy"
        CIBW_BEFORE_BUILD: "python -m pip install scikit-build-core 'tbb<=2020.3.254' numpy cmake ninja -v"
        CIBW_BUILD_VERBOSITY: '1'
        CIBW_ARCHS_LINUX: "x86_64"
        # Only supports cpython 3.9 - 3.13 on manylinux_x86_64
        CIBW_BUILD: 'cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64'
        CIBW_BEFORE_REPAIR: "python -m pip install 'tbb<=2020.3.254'"
        CIBW_REPAIR_WHEEL_COMMAND: >
          sh -c '
            python -m pip install "tbb<=2020.3.254" &&
            PYTHON=`python -c 'import sys; print(sys.executable)'` &&
            export LD_LIBRARY_PATH=`dirname $PYTHON`/../lib &&
            auditwheel repair -w {dest_dir} {wheel}
          '
        CIBW_ENVIRONMENT: 'CMAKE_POLICY_VERSION_MINIMUM=3.5'
    - name: upload Release
      if: ${{ github.event_name == 'release' }}
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        twine upload wheelhouse/*
    - uses: actions/upload-artifact@v4
      with:
        name: bdist-manylinux2010
        path: wheelhouse/*
